<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creating a project from the command menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; min-height: 900px; background: #F6F7F9; color: #111827; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; overflow: hidden">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex">
<div style="flex: 0 0 64px; background: #111827"></div>
<div style="flex: 0 0 248px; background: #FFFFFF; border-right: 1px solid #E5E7EB; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 14px; width: 60%; border-radius: 4px; background: #E5E7EB"></div>
<div style="height: 10px; width: 80%; border-radius: 4px; background: #F3F4F6"></div>
<div style="height: 10px; width: 70%; border-radius: 4px; background: #F3F4F6"></div>
<div style="height: 10px; width: 75%; border-radius: 4px; background: #F3F4F6"></div>
</div>
<div style="flex-grow: 1; background: #FFFFFF"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(17, 24, 39, 0.35)"></div>

<div role="dialog" aria-label="Command menu" style="position: relative; margin: 120px auto 0; width: 92%; max-width: 640px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 24px 60px rgba(17, 24, 39, 0.25); overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid #E5E7EB">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search or run a command</label>
<input id="cmd" value="Launch site" style="flex-grow: 1; border: 0; outline: none; font-size: 17px; font-family: inherit; color: #111827">
<span style="font-size: 11px; color: #5B6472; border: 1px solid #D1D5DB; border-radius: 4px; padding: 0 5px">esc</span>
</div>

<div style="padding: 8px">
<div style="padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6472">Create</div>
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 10px; background: #EFF4FF; color: #111827; text-align: left; font-size: 14px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path></svg></span>
<span style="flex-grow: 1">New project <strong>Launch site</strong><span style="display: block; font-size: 12px; color: #5B6472">Gets a channel, files, a task board and Magnus</span></span>
<span style="font-size: 11px; color: #1D4ED8; border: 1px solid #BFDBFE; border-radius: 4px; padding: 0 5px">Enter</span>
</button>
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; color: #111827; text-align: left; font-size: 14px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #F3F4F6; color: #374151; display: flex; align-items: center; justify-content: center; font-weight: 700">#</span>
<span style="flex-grow: 1">New channel <strong>#launch-site</strong></span>
</button>

<div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6472">Ask Magnus</div>
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; color: #111827; text-align: left; font-size: 14px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #111827; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"></path></svg></span>
<span style="flex-grow: 1">Set up <strong>Launch site</strong> from what we've discussed<span style="display: block; font-size: 12px; color: #5B6472">Magnus creates the project, invites the people in those threads and starts a plan</span></span>
</button>

<div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6472">Go to</div>
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; color: #111827; text-align: left; font-size: 14px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #F3F4F6; color: #374151; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg></span>
<span style="flex-grow: 1">Launch site copy draft<span style="display: block; font-size: 12px; color: #5B6472">File in Investor deck</span></span>
</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 18px; border-top: 1px solid #E5E7EB; font-size: 12px; color: #5B6472">
<span>Up and Down to move</span><span>Enter to choose</span><span>Type @ to invite someone</span>
</div>
</div>

<div style="position: relative; margin: 28px auto 0; width: 92%; max-width: 640px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 12px 30px rgba(17, 24, 39, 0.18); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700">Launch site is ready</div>
<div style="color: #374151">Invite people now, or add them later by mentioning them.</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<label for="invite" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Invite by email</label>
<input id="invite" placeholder="Email addresses, or @name" style="flex: 1 1 260px; height: 38px; border: 1px solid #D1D5DB; border-radius: 10px; padding: 0 12px; font-size: 14px; font-family: inherit">
<button style="height: 38px; padding: 0 16px; border: 0; border-radius: 10px; background: #2563EB; color: #FFFFFF; font-weight: 600">Invite</button>
<button style="height: 38px; padding: 0 14px; border: 1px solid #E5E7EB; border-radius: 10px; background: #FFFFFF; color: #374151; font-weight: 600">Copy link</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
