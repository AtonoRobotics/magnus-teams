id = "google-chat"
version = "2.0.0"
name = "Google Chat"
summary = "Magnus can find your conversations, read and search them, and send, edit or delete your messages when you allow it."
# The Library's card and page (connectors spec, Catalog and connector
# manifests; Library): who makes it, its category chip, what Magnus can do
# with it, each scope in plain words (in the order of `scopes`), and what it
# can and cannot do here, from its tools. `letters` and `tint` draw its tile
# until the provider's own mark is in its listing.
publisher = "Google"
category = "email"
abilities = ["Find a conversation or a decision when you ask about it", "Catch you up on spaces you have been away from", "Send, edit or delete your messages, when you allow it"]
asks = ["See your spaces and conversations", "See who is in your spaces", "Read your messages, and send, edit and delete yours", "Identify your Google account to verify which messages are yours"]
can = "Find your conversations and who is in them, read and search their messages, and send, edit or delete yours (it asks you before each)"
cannot = "Start a conversation, or add or remove people"
letters = "Ch"
tint = "#1A7F64"
# Brokered (Google's hosted Chat server refuses Magnus with 403, as
# Gmail's did): Alpha Vector's server over Chat's API (`brokered/chat`), its
# image named by digest and built from this commit by `brokered/build.sh`;
# each person's runs in a microVM of its own that reaches Chat's API and
# Google's UserInfo endpoint, used only to verify ownership before deletion.
kind = "brokered"
endpoint = "sha256:f7b72163f99a1d27469965ae176a10de3530a4edb2395cce82e45f35d1e51adf"
hosts = ["chat.googleapis.com", "openidconnect.googleapis.com"]
issuer = "https://accounts.google.com"
# Messages reach a conversation's members, who may be outside the organisation.
audience = "public"
label = "private+untrusted"
registration = "preregistered"
provider = "google"
# Where a person removes Magnus at Google when Disconnect could not revoke it.
remove_access = "https://myaccount.google.com/connections"
# The narrowest that cover the tools (Chat API reference, each method's
# Authorization scopes): `chat.spaces.readonly` (spaces list,
# findDirectMessage), `chat.memberships.readonly` (members list) and
# `chat.messages` (messages list, get, create, patch, delete;
# `chat.messages.readonly` with `chat.messages.create` cannot edit or
# delete). Existing users may need to grant the broader message scope.
# OpenID identifies the account before deletion without requesting profile or email.
# Google Chat must be enabled for their account; writes also require the
# project's Chat app configuration (DECISIONS.md).
scopes = ["https://www.googleapis.com/auth/chat.spaces.readonly", "https://www.googleapis.com/auth/chat.memberships.readonly", "https://www.googleapis.com/auth/chat.messages", "openid"]

# Exactly the tools its image lists (`every_tool_is_classed_in_the_manifest`).
[tools]
search_conversations = "read"
list_members = "read"
list_messages = "read"
search_messages = "read"
get_message = "read"
# Everyone in the conversation sees a message sent, an edit (marked as
# one) or a deletion, and what they saw cannot be called back.
send_message = "irreversible"
update_message = "irreversible"
delete_message = "irreversible"
