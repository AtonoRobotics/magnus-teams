id = "google-gmail"
version = "1.3.0"
name = "Gmail"
summary = "Magnus can search and read your email, write drafts and send one when you allow it, and file, label or trash messages."
# The Library's card and page (connectors spec, Catalog and connector
# manifests; Library): who makes it, its category chip, what Magnus can do
# with it, each scope in plain words (in the order of `scopes`), and what it
# can and cannot do here, from its tools. `letters` and `tint` draw its tile
# until the provider's own mark is in its listing.
publisher = "Google"
category = "email"
abilities = ["Find an email or a thread when you ask about it", "Summarize long threads and catch you up", "Write drafts, replies and forwards, and send one when you allow it", "Label, file or trash messages"]
asks = ["Read, write, send and label your email"]
can = "Read, write, send, reply to and forward your email (it asks you before each send), and label, file or trash messages"
cannot = "Delete an email for good"
letters = "Gm"
tint = "#B3261E"
# Brokered (owner, 2026-11-03: Google's hosted Gmail server cannot send
# email): Alpha Vector's server over Gmail's API (`brokered/gmail`), its
# image named by digest and built from this commit by `brokered/build.sh`;
# each person's runs in a microVM of its own that reaches only Gmail's API,
# and people sign in at Google.
kind = "brokered"
endpoint = "sha256:5d1266cacb4e54571e5c2736b0541a59d35c8c221c26b0b10c2daedde775238f"
hosts = ["gmail.googleapis.com"]
issuer = "https://accounts.google.com"
# A draft it sends reaches anyone the person writes to. What comes back is
# their private mail, written by others.
audience = "public"
label = "private+untrusted"
registration = "preregistered"
provider = "google"
# Where a person removes Magnus at Google when Disconnect could not revoke it.
remove_access = "https://myaccount.google.com/connections"
# `gmail.modify` alone: it is among the scopes of every method the tools use
# (Gmail API reference, each method's Authorization scopes), and it never
# deletes mail for good (only `https://mail.google.com/` can).
scopes = ["https://www.googleapis.com/auth/gmail.modify"]

# Exactly the tools its image lists (`every_tool_is_classed_in_the_manifest`).
[tools]
search_threads = "read"
get_thread = "read"
get_message = "read"
list_drafts = "read"
get_draft = "read"
list_labels = "read"
create_draft = "reversible_write"
update_draft = "reversible_write"
reply_draft = "reversible_write"
forward_draft = "reversible_write"
# Sent mail cannot be called back, and a deleted draft is gone for good
# (drafts.delete: "Immediately and permanently deletes the specified draft").
send_draft = "irreversible"
delete_draft = "irreversible"
create_label = "reversible_write"
label_message = "reversible_write"
unlabel_message = "reversible_write"
label_thread = "reversible_write"
unlabel_thread = "reversible_write"
update_message_labels = "reversible_write"
trash_message = "reversible_write"
untrash_message = "reversible_write"
trash_thread = "reversible_write"
untrash_thread = "reversible_write"
mark_message_spam = "reversible_write"
unmark_message_spam = "reversible_write"
mark_thread_spam = "reversible_write"
unmark_thread_spam = "reversible_write"

# What each tool reaches (approvals spec, The approval model; Email end to
# end). `self`: it stays in the person's own account, a draft, a label, the
# trash or spam, and reaches no one, so it does not count as sending under
# the Rule of Two. delete_draft is irreversible and still asks by policy.
# send_draft is left out of [reach]: who it reaches is the draft's To, Cc and
# Bcc, read at the gate in [destinations.send_draft].
[reach]
create_draft = "self"
update_draft = "self"
reply_draft = "self"
forward_draft = "self"
delete_draft = "self"
create_label = "self"
label_message = "self"
unlabel_message = "self"
label_thread = "self"
unlabel_thread = "self"
update_message_labels = "self"
trash_message = "self"
untrash_message = "self"
trash_thread = "self"
untrash_thread = "self"
mark_message_spam = "self"
unmark_message_spam = "self"
mark_thread_spam = "self"
unmark_thread_spam = "self"
# Who a send reaches is read from the draft at the gate (get_draft), never
# taken from what Magnus wrote: the card shows its To, Cc and Bcc, subject,
# text and attachments, and an approval holds only for exactly those, and
# for a digest of every part (the HTML part, each attachment's bytes) the
# card does not show: a change to any part asks again.
[destinations.send_draft]
read = "get_draft"
id = "draft_id"
recipients = ["/message/to", "/message/cc", "/message/bcc"]
content = ["/message/subject", "/message/body", "/message/attachments"]
bound = ["/message/digest"]

# Whether the person has mailed an address before: sent mail searched for
# it, a recipient-provenance source beside their own words (#210).
[sent]
read = "search_threads"
input = "query"
query = "in:sent to:{address}"
found = "/threads"
