id = "vercel"
version = "1.0.0"
name = "Vercel"
summary = "Magnus can look into your Vercel projects, deployments, logs and errors, and deploy, change settings or roll back with your approval."
# The Library's card and page (connectors spec, Catalog and connector
# manifests; Library): who makes it, its category chip, what Magnus can do
# with it, each scope in plain words (in the order of `scopes`), and what it
# can and cannot do here, from its tools. `letters` and `tint` draw its tile
# until the provider's own mark is in its listing.
publisher = "Vercel"
category = "code"
abilities = ["Find a project or deployment when you ask about it", "Read build logs, runtime logs and errors to find what went wrong", "Deploy, promote or roll back, when you allow each one", "Change domains, environment variables and settings, when you allow each one"]
asks = ["Know who you are on Vercel", "Stay connected until you disconnect"]
can = "Read your projects, deployments, logs, errors, domains and analytics, and deploy, roll back or change settings when you allow each one"
cannot = "Change anything without asking you first, buy anything without your approval, or reach a team you did not grant on Vercel's own page when you sign in"
letters = "Ve"
tint = "#000000"
# Vercel's remote server (vercel.com/docs/mcp/vercel-mcp), streamable HTTP.
# Its protected-resource metadata names https://vercel.com, whose metadata
# offers PKCE (S256), revocation, and registration; but Vercel MCP takes
# only clients it has reviewed or that identify themselves by a metadata
# document, so Magnus signs in with Alpha Vector's client, "Magnus by Alpha
# Vector", which is public (no secret). Vercel matches the callback exactly,
# port included, so the desktop listens at the one loopback address the
# client registers until the relay's callback replaces it
# (docs/remote-access-and-relay.md, "Redirects to switch, later").
kind = "remote"
endpoint = "https://mcp.vercel.com/"
redirect_uri = "http://127.0.0.1:17321/callback"
# Deployments, domains and comments reach anyone who visits or shares the
# project. What comes back is the person's projects, logs and comments,
# written by their apps, visitors and teammates.
audience = "public"
label = "private+untrusted"
registration = "preregistered"
provider = "vercel"
# Where a person removes Magnus at Vercel when Disconnect could not revoke it.
remove_access = "https://vercel.com/account"
# The one scope its server's metadata offers, and a refresh token so the
# connection outlasts the access token. Which teams Magnus reaches is what
# the person grants on Vercel's page.
scopes = ["openid", "offline_access"]

# The tools mcp.vercel.com lists, from Vercel's tool reference
# (vercel.com/docs/agent-resources/vercel-mcp/tools and its categories,
# read 2026-11-10) and the list it gave a signed-in client the same day.
# Strictest class where unsure: deploying, promoting, rolling back, pausing,
# domains, DNS, certificates, environment variables (and reading their
# decrypted values), keys and tokens, protection, firewall, routing,
# feature flags and Global Config items that live traffic reads, log drains
# and anything that grants access are irreversible. Buying domains and
# running sandboxes, CI or checks, which Vercel bills, are financial.
