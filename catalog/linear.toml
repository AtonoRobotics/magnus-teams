id = "linear"
version = "1.0.0"
name = "Linear"
summary = "Magnus can search and read your Linear issues, projects, cycles and comments, and create or update issues when your request needs it."
publisher = "Linear"
category = "work"
abilities = ["Find issues, projects, cycles or teammates when you ask about them", "Read an issue's full description, comments and status history", "Create and update issues or post comments, when you allow each one"]
asks = ["Read your Linear teams, projects, cycles and issues", "Create, update and comment on issues when your request needs it"]
can = "Search and read your Linear issues, projects, cycles and teams, and create, update or comment on issues when you allow each one"
cannot = "Change anything in Linear you did not ask for without asking you first, or reach teams you cannot see in Linear"
letters = "Li"
tint = "#5E6AD2"
kind = "remote"
endpoint = "https://mcp.linear.app/mcp"
audience = "public"
label = "private+untrusted"
registration = "dcr"
remove_access = "https://linear.app/settings/account/security"
scopes = ["read", "write"]

[tools]
list_issues = "read"
get_issue = "read"
search_issues = "read"
list_projects = "read"
get_project = "read"
list_teams = "read"
get_team = "read"
list_cycles = "read"
list_comments = "read"
list_users = "read"
create_issue = "irreversible"
update_issue = "irreversible"
create_comment = "irreversible"
create_project = "irreversible"
update_project = "irreversible"
