[package]
name = "magnus-adapter-openai"
description = "Magnus model adapter for OpenAI-compatible providers (Chat Completions and Responses; API key or OAuth)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "magnus-adapter-openai"
path = "src/main.rs"

[dependencies]
magnus-adapter-proto = { path = "../adapter-proto" }
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
