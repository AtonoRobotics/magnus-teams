[package]
name = "magnus-adapter-anthropic"
description = "Magnus model adapter for the Anthropic Messages API."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "magnus-adapter-anthropic"
path = "src/main.rs"

[dependencies]
magnus-adapter-proto = { path = "../adapter-proto" }
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
