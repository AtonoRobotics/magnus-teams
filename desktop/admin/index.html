<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{org}} · Magnus admin</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/admin.css">
<script src="/assets/theme.js"></script>
<script src="/assets/admin.js" defer></script>
</head>
<body>
<header class="ad-top">
  <strong class="ad-org">{{org}}</strong>
  <span class="ad-status" id="status" role="status" aria-live="polite"><span class="dot"></span><span class="small muted">Checking the appliance</span></span>
  <span class="ad-spacer"></span>
  <span id="kill" class="ad-kill" hidden></span>
  <span id="me" class="ad-me"></span>
</header>
<nav class="ad-nav" aria-label="Sections" id="nav" hidden>
  <a href="#/overview" data-section="overview">Overview</a>
  <a href="#/knowledge" data-section="knowledge">Knowledge</a>
  <a href="#/users" data-section="users">Users</a>
  <a href="#/security" data-section="security">Security</a>
  <a href="#/operations" data-section="operations">Operations</a>
</nav>
<main class="ad-main" id="main" tabindex="-1">
  <section class="card ad-sign-in" id="sign-in" aria-labelledby="sign-in-title">
    <h1 id="sign-in-title">Admin console</h1>
    <p class="muted">Sign in with your {{org}} account. Only admins can enter, and only from the organisation's network or its VPN.</p>
    <div class="row"><a class="button primary" href="/auth/local" id="sign-in-go">Sign in</a></div>
  </section>
</main>
</body>
</html>
