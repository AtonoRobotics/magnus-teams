[package]
name = "magnus-brokered-kit"
description = "What every brokered connector's server shares: MCP over vsock, the way out through the appliance's egress proxy over TLS, and the schema check both sides run."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"

[lints]
workspace = true
