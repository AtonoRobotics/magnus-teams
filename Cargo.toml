[workspace]
resolver = "2"
members = ["crates/magnus", "crates/computerd", "crates/adapter-proto", "crates/adapter-anthropic", "crates/adapter-openai", "sandbox/guest", "brokered/*", "tests/invariants", "tests/scratch"]

[workspace.package]
edition = "2021"
version = "0.2.5"
license = "UNLICENSED"
publish = false

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# A volume is sealed in debug builds too, and tests wait on it.
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
