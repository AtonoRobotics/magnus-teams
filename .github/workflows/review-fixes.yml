name: review-fixes
on:
  push:
    branches: [codex/fix-deep-review]
permissions:
  contents: read
concurrency:
  group: review-fixes
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, linux, strix-build]
    timeout-minutes: 90
    env:
      MAGNUS_TEST_PG: postgres://postgres:magnus_dev@127.0.0.1:54361/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolated build directory
        run: echo "CARGO_TARGET_DIR=$HOME/magnus-teams-ci/targets/deep-review-fixes" >> "$GITHUB_ENV"
      - name: Compile programs
        run: cargo build --workspace --bins
      - name: Unit and database regressions
        run: cargo test --workspace --lib --bins
      - name: Desktop checks
        run: |
          for test in desktop/tests/*-check.mjs; do node "$test" || exit; done
      - name: Size ratchet
        run: sh ci/ratchet.sh size
      - name: Clippy ratchet
        run: sh ci/ratchet.sh clippy
