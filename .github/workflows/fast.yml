# The fast tier: runs on every push, on a throwaway hosted runner. Its target
# is five minutes once the build cache is warm; on 2026-11-13 warm runs took
# 4 to 5 minutes, about 3.5 of them `cargo test --workspace --lib --bins`
# and 35 seconds clippy. The timeout is twice that, so a hung test fails the
# run in ten minutes instead of thirty (decisions/2026-11-13-ci-and-test-hygiene.md).
# Heavy suites run as acceptance against a release candidate, not here (see
# AGENTS.md, "How work lands").
#
# A push to main is released only after this run passes for that commit:
# release.yml starts on this workflow's completion, not on the push
# (decisions/2026-11-20-release-waits-for-fast.md). The workflow's name,
# "fast", is what release.yml waits for; renaming it stops releases.
name: fast
on:
  push:
  workflow_dispatch:
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: magnus_dev
        ports:
          - 54340:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Pinned Node
        # The same Node on every machine (ci/ensure-node.sh, .node-version).
        run: sh ci/ensure-node.sh >> "$GITHUB_PATH"
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Every check is in ci/fast.sh, which a manual release runs too.
      - run: sh ci/fast.sh
