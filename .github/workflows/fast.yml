# The fast tier: runs on every push, on a throwaway hosted runner. Its target
# is five minutes once the build cache is warm; on 2026-11-13 warm runs took
# 4 to 5 minutes, about 3.5 of them `cargo test --workspace --lib --bins`
# and 35 seconds clippy. The timeout was twice that, so a hung test fails the
# run long before thirty minutes (decisions/2026-11-13-ci-and-test-hygiene.md).
# On 2026-11-23 the same commit's lib tests took 156 s on one runner and
# 285 s on another, and a whole run passed ten minutes with every test
# passing, so the timeout is fifteen
# (decisions/2026-11-23-fast-tier-timeout-fifteen-minutes.md).
# Heavy suites run as acceptance against a release candidate, not here (see
# AGENTS.md, "How work lands").
#
# The desktop app is a Cargo workspace of its own, which the workspace checks
# never compile; the `desktop` job compiles and tests it, beside the other
# checks rather than after them, so the run takes no longer
# (decisions/2026-11-27-fast-tier-compiles-the-desktop-app.md).
#
# A push to main is released only after this run passes for that commit:
# release.yml starts on this workflow's completion, not on the push
# (decisions/2026-11-20-release-waits-for-fast.md). The workflow's name,
# "fast", is what release.yml waits for; renaming it stops releases.
#
# Runs are a first-in, first-out queue (decisions/2026-11-27-fast-runs-fifo.md).
# Every push gets its own run, in a concurrency group of its own commit, so
# no push is cancelled or replaced and each gets its own verdict. The checks
# run in parallel; the last job, `in-order`, waits until the previous push's
# run has completed. Runs therefore complete in push order, and so do the
# releases that start on their completion.
name: fast
on:
  push:
  workflow_dispatch:
concurrency:
  group: fast-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: magnus_dev
        ports:
          - 54340:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Pinned Node
        # The same Node on every machine (ci/ensure-node.sh, .node-version).
        run: sh ci/ensure-node.sh >> "$GITHUB_PATH"
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Every check is in ci/fast.sh, which a manual release runs too.
      - run: sh ci/fast.sh checks
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Tauri's Linux libraries
        run: sh ci/desktop-libs.sh
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: sh ci/fast.sh desktop
  in-order:
    # Waits, whatever this run's verdict, for the previous push's run to
    # complete, so runs complete in push order. The run's verdict stays the
    # checks' (the fast and desktop jobs).
    needs: [fast, desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Wait for the previous push's run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: sh ci/fast-wait-previous.sh "$REPOSITORY" "$PREVIOUS_SHA"
