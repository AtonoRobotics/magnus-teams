# The fast tier: runs on every push, on a throwaway hosted runner. Its target
# is five minutes once the build cache is warm; on 2026-11-13 warm runs took
# 4 to 5 minutes, about 3.5 of them `cargo test --workspace --lib --bins`
# and 35 seconds clippy. The timeout is twice that, so a hung test fails the
# run in ten minutes instead of thirty (decisions/2026-11-13-ci-and-test-hygiene.md).
# Heavy suites run as acceptance against a release candidate, not here (see
# AGENTS.md, "How work lands").
name: fast
on:
  push:
  workflow_dispatch:
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: magnus_dev
        ports:
          - 54340:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: sh ci/production-guard-check.sh
      - run: sh ci/strix-gc-check.sh
      - run: sh ci/ratchet-check.sh
      - run: python3 -I sandbox/desktop/test_desktop.py
      - run: python3 -I sandbox/test_images.py
      - run: node desktop/tests/ui-spec-check.mjs
      - run: node desktop/tests/rfb-check.mjs
      - run: node desktop/tests/screen-check.mjs
      - run: node desktop/tests/takeover-check.mjs
      - run: node desktop/tests/handback-sheet-check.mjs
      - run: node desktop/tests/computer-panel-check.mjs
      - run: node desktop/tests/computer-desk-check.mjs
      - run: node desktop/tests/one-computer-check.mjs
      - run: node desktop/tests/desktop-look-check.mjs
      - run: node desktop/tests/solid-start-check.mjs
      - run: node desktop/tests/team-check.mjs
      - run: node desktop/tests/team-own-check.mjs
      - run: node desktop/tests/message-controls-check.mjs
      - run: node desktop/tests/chat-view-check.mjs
      - run: node desktop/tests/team-members-check.mjs
      - run: node desktop/tests/subagents-check.mjs
      - run: node desktop/tests/connect-check.mjs
      - run: node desktop/tests/globals-check.mjs
      - run: node desktop/tests/asks-check.mjs
      - run: node desktop/tests/evidence-check.mjs
      - run: node desktop/tests/status-line-check.mjs
      - run: node desktop/tests/dev-reasoning-check.mjs
      - run: node desktop/tests/banners-check.mjs
      - run: node desktop/tests/wording-check.mjs
      - run: node desktop/tests/password-check.mjs
      - run: node desktop/tests/admin-check.mjs
      - run: node desktop/tests/admin-overview-check.mjs
      - run: node desktop/tests/admin-people-check.mjs
      - run: node desktop/tests/admin-connectors-check.mjs
      - run: node desktop/tests/admin-rules-check.mjs
      - run: node desktop/tests/admin-security-check.mjs
      - run: node desktop/tests/admin-ops-check.mjs
      - run: node desktop/tests/spend-check.mjs
      - run: node desktop/tests/admin-agents-check.mjs
      - run: node desktop/tests/settings-moved-check.mjs
      - run: node desktop/tests/agreements-check.mjs
      - run: ci/ratchet.sh size
      - run: ci/ratchet.sh clippy
      - run: cargo test --workspace --lib --bins
